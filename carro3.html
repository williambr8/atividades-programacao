<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoPrime Veículos</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI, sans-serif;
}

body{
    background:#f2f2f2;
}

header{
    background:#111;
    color:white;
    padding:20px;
    text-align:center;
}

.container{
    max-width:1200px;
    margin:30px auto;
    padding:20px;
}

.filters{
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:30px;
    display:flex;
    flex-wrap:wrap;
    gap:15px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.filters select,
.filters input{
    padding:10px;
    border-radius:6px;
    border:1px solid #ccc;
    flex:1;
    min-width:150px;
}

.filters button{
    background:#111;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:6px;
    cursor:pointer;
}

.filters button:hover{
    background:#333;
}

.cars{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(280px,1fr));
    gap:20px;
}

.car{
    background:white;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
    transition:0.3s;
}

.car:hover{
    transform:translateY(-5px);
}

.car img{
    width:100%;
    height:180px;
    object-fit:cover;
}

.car-content{
    padding:15px;
}

.car-content h3{
    margin-bottom:10px;
}

.price{
    color:green;
    font-weight:bold;
    font-size:20px;
    margin-bottom:10px;
}

footer{
    background:#111;
    color:white;
    text-align:center;
    padding:20px;
    margin-top:40px;
}
</style>
</head>
<body>

<header>
    <h1>🚘 AutoPrime Veículos</h1>
</header>

<div class="container">

    <!-- FILTROS -->
    <div class="filters">
        <select id="brand">
            <option value="">Todas as Marcas</option>
            <option value="Honda">Honda</option>
            <option value="Toyota">Toyota</option>
            <option value="BMW">BMW</option>
        </select>

        <input type="number" id="maxPrice" placeholder="Preço máximo (R$)">

        <input type="number" id="minYear" placeholder="Ano mínimo">

        <button onclick="filterCars()">Filtrar</button>
    </div>

    <!-- CARROS -->
    <div class="cars" id="carList"></div>

</div>

<footer>
    © 2026 AutoPrime Veículos
</footer>

<script>

const cars = [
    {
        brand:"Honda",
        model:"Civic",
        year:2020,
        price:89900,
        image:"https://via.placeholder.com/400x200"
    },
    {
        brand:"Toyota",
        model:"Corolla",
        year:2022,
        price:105000,
        image:"https://via.placeholder.com/400x200"
    },
    {
        brand:"BMW",
        model:"320i",
        year:2021,
        price:189000,
        image:"https://via.placeholder.com/400x200"
    },
    {
        brand:"Honda",
        model:"HR-V",
        year:2019,
        price:82000,
        image:"https://via.placeholder.com/400x200"
    }
];

function displayCars(carArray){
    const carList = document.getElementById("carList");
    carList.innerHTML = "";

    if(carArray.length === 0){
        carList.innerHTML = "<p>Nenhum carro encontrado.</p>";
        return;
    }

    carArray.forEach(car=>{
        carList.innerHTML += `
        <div class="car">
            <img src="${car.image}">
            <div class="car-content">
                <h3>${car.brand} ${car.model}</h3>
                <p>Ano: ${car.year}</p>
                <p class="price">R$ ${car.price.toLocaleString()}</p>
            </div>
        </div>
        `;
    });
}

function filterCars(){
    const brand = document.getElementById("brand").value;
    const maxPrice = document.getElementById("maxPrice").value;
    const minYear = document.getElementById("minYear").value;

    let filtered = cars.filter(car=>{
        return (
            (brand === "" || car.brand === brand) &&
            (maxPrice === "" || car.price <= maxPrice) &&
            (minYear === "" || car.year >= minYear)
        );
    });

    displayCars(filtered);
}

displayCars(cars);

</script>

</body>
</html>
