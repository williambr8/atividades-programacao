<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoPrime - Portal de Veículos</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f6f8;
}

/* HEADER */
header{
    background: url('https://images.unsplash.com/photo-1503376780353-7e6692767b70?q=80&w=1600') center/cover no-repeat;
    color:white;
    padding:60px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:relative;
}

header::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.6);
}

header h1,
.search-bar{
    position:relative;
    z-index:1;
}



header h1{
    font-size:22px;
}

.search-bar{
    display:flex;
    gap:10px;
}

.search-bar input{
    padding:10px;
    border-radius:6px;
    border:none;
    width:250px;
}

/* LAYOUT */
.main{
    display:flex;
    max-width:1300px;
    margin:30px auto;
    gap:20px;
    padding:0 20px;
}

/* FILTROS LATERAIS */
.sidebar{
    width:250px;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 4px 15px rgba(0,0,0,0.08);
}

.sidebar h3{
    margin-bottom:15px;
}

.sidebar select,
.sidebar input{
    width:100%;
    padding:10px;
    margin-bottom:15px;
    border-radius:6px;
    border:1px solid #ccc;
}

.sidebar button{
    width:100%;
    padding:10px;
    background:#ff6b00;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

.sidebar button:hover{
    background:#e65c00;
}

/* LISTA DE CARROS */
.cars{
    flex:1;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(280px,1fr));
    gap:20px;
}

.card{
    background:white;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 4px 20px rgba(0,0,0,0.08);
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.card img{
    width:100%;
    height:180px;
    object-fit:cover;
}

.card-content{
    padding:15px;
}

.card-content h3{
    font-size:18px;
    margin-bottom:8px;
}

.card-content p{
    font-size:14px;
    color:#555;
    margin-bottom:5px;
}

.price{
    font-size:20px;
    font-weight:bold;
    color:#0a8f2f;
    margin:10px 0;
}

.btn-whatsapp{
    width:100%;
    padding:10px;
    background:#25D366;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

.btn-whatsapp:hover{
    background:#1ebe5d;
}

/* RESPONSIVO */
@media(max-width:900px){
    .main{
        flex-direction:column;
    }

    .sidebar{
        width:100%;
    }
}
</style>
</head>
<body>

<header>
    <h1>AutoPrime</h1>
    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Buscar modelo...">
    </div>
</header>

<div class="main">

    <!-- FILTROS -->
    <div class="sidebar">
        <h3>Filtrar</h3>

        <select id="brand">
            <option value="">Marca</option>
            <option value="Honda">Honda</option>
            <option value="Toyota">Toyota</option>
            <option value="BMW">BMW</option>
        </select>

        <input type="number" id="maxPrice" placeholder="Preço máximo">

        <input type="number" id="minYear" placeholder="Ano mínimo">

        <button onclick="filterCars()">Aplicar Filtros</button>
    </div>

    <!-- CARROS -->
    <div class="cars" id="carList"></div>

</div>

<script>

const cars = [
{
brand:"Honda",
model:"Civic",
year:2020,
price:89900,
image:"https://images.unsplash.com/photo-1609521263047-f8f205293f24?q=80&w=1000"
},
{
brand:"Toyota",
model:"Corolla",
year:2022,
price:105000,
image:"https://images.unsplash.com/photo-1619767886558-efdc259cde1a?q=80&w=1000"
},
{
brand:"BMW",
model:"320i",
year:2021,
price:189000,
image:"https://images.unsplash.com/photo-1555215695-3004980ad54c?q=80&w=1000"
},
{
brand:"Honda",
model:"HR-V",
year:2019,
price:82000,
image:"https://images.unsplash.com/photo-1590362891991-f776e747a588?q=80&w=1000"
}
];

function displayCars(carArray){
const carList = document.getElementById("carList");
carList.innerHTML = "";

carArray.forEach(car=>{
carList.innerHTML += `
<div class="card">
<img src="${car.image}">
<div class="card-content">
<h3>${car.brand} ${car.model}</h3>
<p>Ano: ${car.year}</p>
<p class="price">R$ ${car.price.toLocaleString()}</p>
<button class="btn-whatsapp" onclick="window.open('https://wa.me/5511999999999')">
Falar no WhatsApp
</button>
</div>
</div>
`;
});
}

function filterCars(){
const brand = document.getElementById("brand").value;
const maxPrice = document.getElementById("maxPrice").value;
const minYear = document.getElementById("minYear").value;
const search = document.getElementById("searchInput").value.toLowerCase();

let filtered = cars.filter(car=>{
return (
(brand === "" || car.brand === brand) &&
(maxPrice === "" || car.price <= maxPrice) &&
(minYear === "" || car.year >= minYear) &&
(car.model.toLowerCase().includes(search))
);
});

displayCars(filtered);
}

document.getElementById("searchInput").addEventListener("input", filterCars);

displayCars(cars);

</script>

</body>
</html>
